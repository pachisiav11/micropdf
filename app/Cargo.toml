[package]
name = "micropdf"
description = "Lightweight PDF reader and editor for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arboard = "3.6.1"
mp-ai = { path = "../crates/mp-ai" }
mp-engine = { path = "../crates/mp-engine" }
notify = "8.2.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Software renderer only: the M0 benchmark measured 8.6 MB idle vs 23.3 MB for FemtoVG, and it
# scrolled faster (bench/README.md). Skia is out: its libjpeg-turbo clashes with MuPDF's libjpeg.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-software",
    # Drag-and-drop of files needs winit window events.
    "unstable-winit-030",
] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps", "Win32_System_Registry"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
