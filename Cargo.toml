[workspace]
resolver = "3"
members = ["app", "crates/mp-ai", "crates/mp-bridge", "crates/mp-engine"]
exclude = ["third_party"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/pachisiav11/micropdf"
publish = false

[workspace.dependencies]
# No bundled CJK/Noto fonts and no font-kit: mp-engine's own loader finds installed fonts
# (crates/mp-engine/src/fonts.rs). No Tesseract (Windows OCR is used instead).
mupdf = { version = "0.8", default-features = false, features = [
    "base14-fonts",
    "js",
    "html",
    "img",
    "docx-output",
    "brotli",
] }

[patch.crates-io]
# Adds Context::shrink_store and more; see third_party/README.md.
mupdf = { path = "third_party/mupdf-rs" }
# Fixes MuPDF's JavaScript getField; see third_party/README.md.
mupdf-sys = { path = "third_party/mupdf-sys" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Full debug info for every dependency made the debug build cache tens of gigabytes. Line
# tables keep file:line in our backtraces; dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
