[package]
name = "mp-ai"
description = "The assistant: Anthropic, OpenAI and Google clients, page retrieval, keys and chats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# WinHTTP rather than an HTTP crate: the system's TLS and proxy settings, and nothing added to
# the binary.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Credentials", "Win32_System_SystemInformation"] }
