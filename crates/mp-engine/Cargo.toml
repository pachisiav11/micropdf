[package]
name = "mp-engine"
description = "Safe wrapper over MuPDF for micropdf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# DirectWrite font names for the system-font loader (src/fonts.rs).
dwrote = { version = "0.11.5", default-features = false }
mupdf.workspace = true
# Reads XFDF form data (src/forms.rs); already in the tree through Slint's SVG support.
roxmltree = "0.21"
# ReplaceFileW for saving over the open file (src/annots.rs).
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
