name: Feature request
description: Suggest a tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do
      description: The task you are trying to get done, not just the button you want.
    validations:
      required: true
  - type: textarea
    id: acrobat
    attributes:
      label: How Acrobat or other tools handle it (optional)
