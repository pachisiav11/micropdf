# Vendored from crates.io mupdf-sys 0.8.0 for micropdf, without the MuPDF sources; see
# third_party/README.md.
[package]
name = "mupdf-sys"
version = "0.8.0"
edition = "2021"
description = "Rust FFI binding to MuPDF"
license = "AGPL-3.0"
links = "mupdf-wrapper"
repository = "https://github.com/messense/mupdf-rs"
publish = false

[features]
default = ["base14-fonts"]
# Use system libs for most thirdparty libs
sys-lib = []
# Use system freetype
sys-lib-freetype = []
# Use system gumbo parser
sys-lib-gumbo = []
# Use system harfbuzz
sys-lib-harfbuzz = []
# Use system jbig2dec
sys-lib-jbig2dec = []
# Use system jpegxr
sys-lib-jpegxr = []
# Use system lcms2
sys-lib-lcms2 = []
# Use system libjpeg
sys-lib-libjpeg = []
# Use system openjpeg
sys-lib-openjpeg = []
# Use system zlib
sys-lib-zlib = []
# Use system leptonica
sys-lib-leptonica = []
# Use system tesseract
sys-lib-tesseract = []
# Use system zxing-cpp
sys-lib-zxingcpp = []
# Use system brotli
sys-lib-brotli = []

# Deprecated no-op. Large non-URW fonts are no longer compiled into mupdf-sys;
# use mupdf's runtime bundled font features instead.
all-fonts = []
# Compile the URW base14 fonts (~600KB). Disabling this defines TOFU_BASE14,
# which makes plain PDFs render without text unless replacement fonts are
# provided at runtime.
base14-fonts = []

js = []
xps = []
svg = []
cbz = []
img = []
html = []
epub = []
brotli = []
docx-output = []
tesseract = []
zxingcpp = []
libarchive = []

zerocopy = ["dep:zerocopy"]

[build-dependencies]
bindgen = { version = "0.72", default-features = false, features = ["runtime"] }
cc = "1.0.50"
pkg-config = "0.3"
regex = "1.11"
# micropdf: unpack and check the MuPDF sources (see build.rs).
flate2 = "1"
sha2 = "0.10"
tar = "0.4"

[dependencies]
zerocopy = { version = "0.8.17", features = ["derive"], optional = true }
